[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Testing and evaluation framework that measures whether an autonomous AI agent is reliable, accurate, secure, cost-effective and robust under difficult conditions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "plotly>=5.24", "pandas>=2.2"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "scipy>=1.11",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
]

[project.scripts]
arl = "agent_reliability_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plotly.*", "pandas.*"]
ignore_missing_imports = true
